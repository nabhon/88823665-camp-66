<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <!-- Form -->
         <form class="row g-3 mt-2">
            <div class="col-md-4">
                <label for="Fname">First Name</label>
            </div>
            <div class="col-md-8">
                <input type="text" class="form-control" id="Fname" placeholder="Jason">
            </div>
            <div class="col-md-4">
                <label for="Lname">Last Name</label>
            </div>
            <div class="col-md-8">
                <input type="text" class="form-control" id="Fname" placeholder="Westarn">
            </div>
            <div class="col-md-4">
                <label for="dateOfBirth">Date Of Birth</label>
            </div>
            <div class="col-md-8">
                <input type="date" class="form-control" id="dateOfBirth">
            </div>
            <div class="col-md-4">
                <label for="age">Age</label>
            </div>
            <div class="col-md-8">
                <input type="number" placeholder="20" class="form-control" id="age">
            </div>
            <div class="col-md-4">
                <label for="genderInput1">Gender</label>
            </div>
            <div class="col-md-8">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="genderInput" id="genderInput1">
                    <label for="genderInput1" class="form-check-label">Male</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="genderInput" id="genderInput2">
                    <label for="genderInput2" class="form-check-label">Female</label>
                </div>
            </div>
            <div class="col-md-4">
                <label for="photoInpit">Photo</label>
            </div>
            <div class="col-md-8">
                <input type="file" class="form-control" id="photoInput">
            </div>
            <div class="col-md-4">
                <label for="addressArea">Address</label>
            </div>
            <div class="col-md-8">
                <textarea id="addressArea" class="form-control" rows="5"></textarea>
            </div>
            <div class="col-md-4">
                <label for="colorSelector">Favorite Color</label>
            </div>
            <div class="col-md-8">
                <select id="colorSelector" class="form-control">
                    <option selected>Colors</option>
                    <option value="red">Red</option>
                    <option value="greed">Green</option>
                    <option value="blue">Blue</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="songSelector">Favorite Song</label>
            </div>
            <div class="col-md-8">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="songInput" id="songInput1">
                    <label for="songInput1" class="form-check-label">Life</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="songInput" id="songInput2">
                    <label for="songInput2" class="form-check-label">Country</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="songInput" id="songInput3">
                    <label for="songInput3" class="form-check-label">Others</label>
                </div>
            </div>
            <div class="col-12 mt-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="agreeToTOS">
                    <label for="agreeToTOS" class="form-check-label">
                        Agree to have my data collected
                    </label>
                </div>
            </div>
            <div class="col-md-11 mt-4">
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
            <div class="col-md-1 mt-4">
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
         </form>
    </div>
</body>
</html>
